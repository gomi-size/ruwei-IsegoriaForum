# ===== 推荐模块参数（rec.*）=====
# 与 RecServiceImpl 的 @Value 占位符一一对应；调参改这里即可，无需改代码。
# 取值均为文档 14-recommend-module-impl.md 的 Phase 1 默认值（@Value 里的 :冒号后即缺省值，此处显式收口）。
rec:
  # ---- 精排：pScore = hotScore × (1 + α·tagAffinity + β·typeAffinity + γ·boardAffinity) ----
  fine:
    topic: 0.3        # α 标签亲和系数（rec.fine.topic）
    type: 0.2         # β 内容形态亲和系数（rec.fine.type）
    board: 0.1        # γ 板块亲和系数（rec.fine.board）
  # ---- 粗排 ----
  rough:
    top: 300          # 热度截断：候选按 score 降序保留 Top N（rec.rough.top）
  # ---- 召回五路上限（当前代码内为 .last("limit N") 字面量，后续换 @Value 时以此为准）----
  recall:
    follow-limit: 200 # 路① 关注流上限（rec.recall.follow-limit）
    board-limit: 200  # 路② 板块流上限（rec.recall.board-limit）
    hot-limit: 100    # 路③ 热点流上限（rec.recall.hot-limit）
    tag-limit: 150    # 路④ 标签流上限（rec.recall.tag-limit）
    cold-limit: 100   # 路⑤ 冷启动上限（rec.recall.cold-limit）
  # ---- 冷启动 ----
  cold:
    view-threshold: 50  # viewCount 低于该值视为新帖候选（rec.cold.view-threshold）
