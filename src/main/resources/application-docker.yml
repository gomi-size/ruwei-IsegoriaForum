# Docker profile for the IsegoriaForum monolith.
# Activate with: SPRING_PROFILES_ACTIVE=docker,sorce

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/root?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: user
    password: 147258
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379
      password: 147258
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: user
    password: 147258

  elasticsearch:
    uris: http://es:9200
    connection-timeout: 3s
    socket-timeout: 60s

# Profile-specific lists replace the local list from application.yml.
cors:
  allowed-origins:
    - ${SITE_URL:http://localhost:5173}
    - ${ADMIN_URL:http://localhost:5174}

sa-token:
  cookie:
    secure: ${COOKIE_SECURE:false}

storage:
  type: cos

cos:
  client:
    host: ${COS_CLIENT_HOST}
    secret-id: ${COS_CLIENT_SECRET_ID}
    secret-key: ${COS_CLIENT_SECRET_KEY}
    region: ${COS_CLIENT_REGION}
    bucket: ${COS_CLIENT_BUCKET}

logging:
  level:
    root: info
    com.ruwei: info
