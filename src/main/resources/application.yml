server:
  port: 8188
  servlet:
    context-path: /api
  error:
    include-stacktrace: always
    include-message: always

# ===== 跨域配置（CORS）—— 修复 #6 =====
# 允许跨域访问的前端源（协议+域名+端口，必须精确匹配）。
# 严禁使用 *：allowCredentials(true) 下 * 等于任意网站都能携带用户 Cookie 调接口（CSRF 风险）。
# 生产环境请改成真实前端域名，建议放到 application-prod.yml 覆盖本段。
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://127.0.0.1:3000

spring:
  datasource:
    # 数据库连接URL，包含主机、端口、数据库名及常用参数
    url: jdbc:mysql://localhost:3306/frorum?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===== Redis 配置 =====
  # 本地 Redis 默认端口 6379，无密码；如有密码请补充 password 字段
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

sa-token:
  token-name: isegoria            # 前端 header / Cookie 统一使用的 key
  timeout: 7200                  # token 有效期 2h
  active-timeout: 1800           # 30min 内有操作就自动续期（滑动）
  is-concurrent: true            # 允许多端同时在线
  is-share: true                 # 同端共享登录态
  token-style: uuid
  # ===== Cookie 配置 =====
  # Sa-Token 1.39 的 sa-token.cookie 是嵌套对象(SaCookieConfig)，不是布尔开关；
  # 开启 cookie 模式为默认行为，这里只调安全属性。token 会自动写进名为 token-name(isegoria) 的 Cookie。
  cookie:
    path: /
    secure: false                # 本地 http 必须 false；生产环境改为 true（建议用 application-prod.yml 覆盖）
    http-only: true              # 防 XSS 窃取
    same-site: Lax               # 防 CSRF（默认即 Lax，显式写出便于维护）
# sa-token-dao-redis 接管后，登录态自动存入 Redis（分布式共享）

# MyBatis-Plus：实体字段是驼峰(followCount)，数据库列也是驼峰(followCount)；
# 关闭默认的"驼峰转下划线"，否则会自动拼出 follow_count 等不存在的列而报 SQL 错误
mybatis-plus:
  configuration:
    # 改用 slf4j 日志实现，才能按 mapper 粒度控制 SQL 是否打印（StdOutImpl 会绕过日志级别，无法单独静音某条查询）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: false
    global-config:
      db-config:
        logic-delete-field: isDelete   # 逻辑删除字段名
        logic-delete-value: 1         # 已删除值
        logic-not-delete-value: 0     # 未删除值

# 日志级别：其余 mapper 仍打印 SQL（debug）；仅压住敏感词加载这一条查询的 SQL 日志
logging:
  level:
    com.ruwei.mapper: debug
    com.ruwei.mapper.SensitiveWordMapper: warn
    org.springdoc: DEBUG
    io.swagger: DEBUG
    org.springdoc.webmvc: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ruwei.controller
